name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  PROJECT: parking-lot-reservation
  DOCKERFILE: infrastucure/docker/dockerfile
  COMPOSE_FILE: infrastucure/docker/docker-compose.yml
  NGINX_FILE: infrastucure/gateway/nginx.conf

jobs:
  build-and-test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
      security-events: write

  deploy-web:
    name: Deploy Web (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontendu
        working-directory: frontend
        env:
          VITE_USE_MOCK_API: 'true' # backend nie ma jeszcze /parkings
        run: |
          npm ci
          npm run build
          # Wersja do weryfikacji po wdrożeniu (E5)
          echo "{\"version\":\"${GITHUB_SHA}\"}" > dist/version.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wgranie do S3 i invalidacja CloudFront
        working-directory: frontend
        run: |
          param() { aws ssm get-parameter --name "/$PROJECT/public/$1" --query Parameter.Value --output text; }
          BUCKET=$(param frontend-bucket)
          DISTRIBUTION=$(param distribution-id)

          # Pliki z hashem w nazwie: długi cache
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude index.html --exclude version.json \
            --cache-control "public,max-age=31536000,immutable"
          # index.html i version.json: zawsze aktualne
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws s3 cp dist/version.json "s3://$BUCKET/version.json" --cache-control "no-cache"

          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/*" --query Invalidation.Id --output text)
          echo "Invalidacja $ID, czekam na zakończenie"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$ID"

  deploy-app:
    name: Deploy App (ECR + EC2)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build i push obrazów do ECR
        run: |
          REGISTRY=$(aws ssm get-parameter --name "/$PROJECT/public/ecr-registry" --query Parameter.Value --output text)
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

          for SERVICE in authentication-service notification-service reservation-service; do
            IMAGE="$REGISTRY/$PROJECT-$SERVICE"
            docker build -f "$DOCKERFILE" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "backend/services/$SERVICE"
            docker push "$IMAGE:$GITHUB_SHA"
            docker push "$IMAGE:latest"
          done

      - name: Konfiguracja dla VM (SSM)
        run: |
          aws ssm put-parameter --name "/$PROJECT/deploy/compose" --type String \
            --value "file://$COMPOSE_FILE" --overwrite >/dev/null
          aws ssm put-parameter --name "/$PROJECT/deploy/nginx" --type String \
            --value "file://$NGINX_FILE" --overwrite >/dev/null

      - name: Uruchomienie nowej wersji na VM
        run: |
          INSTANCE=$(aws ssm get-parameter --name "/$PROJECT/public/instance-id" --query Parameter.Value --output text)
          COMMAND=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/opt/parking/bin/apply.sh --pull"]' \
            --query Command.CommandId --output text)

          # Do 10 minut (pobranie trzech obrazów na t3.micro)
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "Status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ]

  healthcheck:
    name: Live Healthcheck
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-app]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Weryfikacja wersji i API
        run: |
          URL=$(aws ssm get-parameter --name "/$PROJECT/public/app-url" --query Parameter.Value --output text)
          echo "Adres aplikacji: $URL"

          for i in $(seq 1 10); do
            VERSION=$(curl -fsS "$URL/version.json" | jq -r .version || true)
            API=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            echo "Wersja: $VERSION, /api/health: $API"
            if [ "$VERSION" = "$GITHUB_SHA" ] && [ "$API" = "200" ]; then
              echo "Wdrożona wersja $GITHUB_SHA działa"
              exit 0
            fi
            sleep 15
          done

          echo "Publiczny URL nie zwraca aktualnej wersji"
          exit 1