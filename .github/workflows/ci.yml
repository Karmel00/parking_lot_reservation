name: CI

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  vuln-scan:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Trivy - raport SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Wysyłka wyników do zakładki Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Trivy - bramka HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: vuln-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: vuln-scan
    strategy:
      fail-fast: false
      matrix:
        service:
          - authentication-service
          - notification-service
          - reservation-service
    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: Sprawdzenie składni
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Smoke test (ładowanie aplikacji)
        env:
          # Fikcyjne wartości tylko na potrzeby testu, bez połączenia z bazą
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
        run: node -e "require('./app'); console.log('Aplikacja zaladowana poprawnie')"