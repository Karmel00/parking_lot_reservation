name: parking

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP}

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - reservation-service
      - authentication-service
      - notification-service
    restart: unless-stopped
    logging: *logging

  reservation-service:
    image: ${ECR_REGISTRY}/${PROJECT}-reservation-service:latest
    env_file: app.env
    volumes:
      # Certyfikat CA dla TLS do RDS (pobierany przez vm-init)
      - ./rds-ca.pem:/etc/ssl/rds-ca.pem:ro
    restart: unless-stopped
    logging: *logging

  authentication-service:
    image: ${ECR_REGISTRY}/${PROJECT}-authentication-service:latest
    environment:
      NODE_ENV: production
    restart: unless-stopped
    logging: *logging

  notification-service:
    image: ${ECR_REGISTRY}/${PROJECT}-notification-service:latest
    environment:
      NODE_ENV: production
    restart: unless-stopped
    logging: *logging