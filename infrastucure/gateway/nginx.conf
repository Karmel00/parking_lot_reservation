# Log w formacie JSON
log_format api_json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    access_log /var/log/nginx/access.log api_json;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Healthcheck aplikacji i bazy
    location = /api/health {
        proxy_pass http://reservation-service:8080/health;
    }

    location = /api/health/db {
        proxy_pass http://reservation-service:8080/health/db;
    }

    # API rezerwacji
    location /api/reservations {
        proxy_pass http://reservation-service:8080;
    }

    # Healthcheck
    location = /api/auth/health {
        proxy_pass http://authentication-service:3001/health;
    }

    location = /api/notifications/health {
        proxy_pass http://notification-service:3003/health;
    }

    location / {
        return 404;
    }
}